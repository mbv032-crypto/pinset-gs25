<html lang="ko">
<head>

<title>FOOD LABEL READER</title>

<meta property="og:description" content="Scan the FOOD QR. Read a Korean food label in your language." />

<!--
  ============================================================
  FOOD LABEL READER
  ============================================================
  QR 스캔 → 바코드 추출 → 워커(식약처 OpenAPI) → 번역 → 이중언어 렌더

  설정: 아래 CFG.dataEndpoint 에 워커 URL 을 넣으면 끝.
        비워두면 Setup 서랍에서 사용자가 입력할 수 있다(테스트용).

  푸드QR 은 GS1 Digital Link 다.
        https://foodqr.kr/01/08800336396509
        경로의 "01" 은 GTIN 식별자, 그 뒤가 바코드.

  원재료(prvwCn)는 배열이 아니라 HTML 한 덩어리로 온다.
        <a><span>소맥분(<p class="bold">밀:미국산</p>)</span></a>
        대괄호 [ ] 가 복합원재료의 하위 항목을 나타낸다.
        Workers 에 DOMParser 가 없어 파싱은 여기서 한다.

  카메라는 secure context 전용. https:// 또는 localhost.
        file:// 과 http://192.168.x.x 는 무조건 실패.
        카카오톡·인스타 인앱 브라우저도 차단 → 사진 업로드로 우회.
  ============================================================
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
:root{
  --bg:#fff; --bg-sub:#f6f7f9;
  --ink:#101828; --ink-2:#475467; --ink-3:#98a2b3;
  --line:#e4e7ec; --line-2:#d0d5dd;
  --accent:#0f77e2; --cyan:#00d4ea;
  --ok:#067647; --ok-bg:#ecfdf3;
  --warn:#b54708; --warn-bg:#fffaeb;
  --err:#b42318; --err-bg:#fef3f2;
  --r:6px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{width:min(100%,520px);margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:3px;display:grid;place-items:center;
  font-size:10px;font-weight:800;letter-spacing:-.06em;flex:none}
.top h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.top .src{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:3px;padding:2px 5px}
.top .src.on{color:var(--ok);border-color:var(--ok)}

section{padding:18px 16px;border-bottom:1px solid var(--line)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}

.langs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.langs::-webkit-scrollbar{display:none}
.lang{flex:none;border:1px solid var(--line-2);background:var(--bg);border-radius:var(--r);padding:7px 11px;
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.lang[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}

.stage{position:relative;aspect-ratio:3/4;max-height:56vh;background:#0c1015;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;display:grid;place-items:center}
.stage video,.stage canvas.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0c1015}
.stage .idle{color:#68727f;font-size:12.5px;text-align:center;padding:0 28px;line-height:1.6;z-index:1}
.reticle{position:absolute;inset:0;pointer-events:none}
.scanline{position:absolute;left:31%;right:31%;height:1px;background:var(--cyan);opacity:.9;
  box-shadow:0 0 6px var(--cyan);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{top:37%}50%{top:63%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}
.badge{position:absolute;left:10px;top:10px;z-index:2;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:#cfe9ff;background:rgba(12,16,21,.72);border:1px solid rgba(255,255,255,.16);border-radius:3px;padding:3px 6px}
.stagehint{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:3;max-width:88%;
  background:rgba(12,16,21,.8);border:1px solid rgba(255,255,255,.18);border-radius:999px;
  color:#fff;font-size:13px;font-weight:600;line-height:1.35;padding:8px 14px;text-align:center;
  pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagehint.pulse{animation:hintpulse .45s ease 2}
@keyframes hintpulse{50%{transform:translateX(-50%) scale(1.07)}}
@media (prefers-reduced-motion:reduce){.stagehint.pulse{animation:none}}

.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);
  padding:12px 10px;font-size:14px;font-weight:700;cursor:pointer}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line-2)}
.btn.sm{padding:9px 10px;font-size:13px;font-weight:600;flex:0 0 auto}

.status{margin-top:10px;border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);
  padding:10px 12px;font-size:13px;background:var(--bg-sub);color:var(--ink-2)}
.status.ok{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.status.warn{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.status.err{border-left-color:var(--err);background:var(--err-bg);color:var(--err)}
.status.busy{border-left-color:var(--accent)}
.status b{display:block;margin-bottom:2px}
.status .fix{margin:6px 0 0;padding-left:16px;font-size:12.5px}
.status .fix li{margin:2px 0}

.pname{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.02em;margin:0}
.pname .ko{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);margin-top:3px;letter-spacing:0}
.block{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--err);color:var(--err);background:var(--err-bg);border-radius:3px;
  padding:5px 8px;font-size:12.5px;font-weight:700}
.chip.amber{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip .ko{font-weight:500;color:var(--ink-3);font-size:11px;margin-left:4px}
.sub{font-size:11.5px;color:var(--ink-3);margin:0 0 8px;line-height:1.45}

.li{padding:7px 0;border-bottom:1px dotted var(--line)}
.li:last-child{border-bottom:0}
.li .tr{font-size:14px;display:flex;align-items:baseline;gap:8px}
.li .ko{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:1px;word-break:break-all}
.li .org{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.li[data-d="1"]{padding-left:16px;border-left:1px solid var(--line);margin-left:3px}
.li[data-d="2"]{padding-left:32px;border-left:1px solid var(--line);margin-left:3px}
.li.flag .tr{color:var(--err);font-weight:700}
.li.flag .tr::after{content:"ALLERGEN";margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:700;
  line-height:1.6;border:1px solid currentColor;border-radius:2px;padding:0 3px;flex:none}
.li.amber .tr{color:var(--warn);font-weight:700}
.li.amber .tr::after{content:"CHECK";margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:700;
  line-height:1.6;border:1px solid currentColor;border-radius:2px;padding:0 3px;flex:none}

table.nut{width:100%;border-collapse:collapse;font-size:13.5px}
table.nut td{padding:7px 0;border-bottom:1px dotted var(--line)}
table.nut td:nth-child(2),table.nut td:nth-child(3){text-align:right;font-family:var(--mono);white-space:nowrap}
table.nut td:nth-child(3){color:var(--ink-3);width:48px}
table.nut .ko{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.para{font-size:13.5px;color:var(--ink-2)}
.para .ko{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:3px}

details.drawer{border-top:1px solid var(--line)}
details.drawer>summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary::after{content:"+";margin-left:auto;font-size:15px;color:var(--ink-3)}
details.drawer[open]>summary::after{content:"–"}
.drawer-body{padding:0 16px 18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 11px;
  background:var(--bg);font-size:14px;font-family:var(--mono)}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field .note{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.diag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.diag div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line)}
.diag div:last-child{border-bottom:0}
.diag span:first-child{color:var(--ink-3)}
.diag span:last-child{text-align:right;word-break:break-all}
.diag .no{color:var(--err);font-weight:700}
.diag .yes{color:var(--ok);font-weight:700}
.foot{padding:16px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="mark">FL</div>
    <h1>Food Label Reader</h1>
    <span class="src" id="srcTag">—</span>
  </header>

  <section>
    <p class="lbl" id="l_lang">Your language</p>
    <div class="langs" id="langs" role="group"></div>
  </section>

  <section>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay hidden></video>
      <canvas class="preview" id="preview" hidden></canvas>
      <div class="idle" id="idle">Camera off</div>
      <div class="reticle" id="reticle" hidden>
        <svg viewBox="0 0 300 400" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
          <path d="M92 166 V142 H116 M184 142 H208 V166 M208 234 V258 H184 M116 258 H92 V234"
                fill="none" stroke="#00d4ea" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="scanline"></div>
      </div>
      <div class="badge" id="badge" hidden>LIVE</div>
      <div class="stagehint" id="stageHint" hidden></div>
    </div>

    <div class="row">
      <button class="btn" id="btnStart">Start camera</button>
      <button class="btn ghost sm" id="btnTorch" hidden>Flash</button>
      <button class="btn ghost sm" id="btnStop" hidden>Stop</button>
    </div>
    <div class="row"><button class="btn ghost" id="btnPick">Use a photo instead</button></div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden />
    <input type="file" id="filePick" accept="image/*" hidden />
    <div class="status" id="status" hidden></div>
  </section>

  <section id="resultSec" hidden>
    <p class="lbl" id="l_result">Label</p>
    <div id="result"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="btnAgain">Scan another</button>
      <button class="btn ghost sm" id="btnOriginal" hidden>Korean page</button>
    </div>
  </section>

  <details class="drawer">
    <summary>Setup</summary>
    <div class="drawer-body">
      <div class="field">
        <label for="cfgData">Data endpoint</label>
        <input id="cfgData" type="url" inputmode="url" placeholder="https://your-worker.workers.dev/foodqr" autocomplete="off" />
        <p class="note">워커의 /foodqr 라우트. 정식 배포 시엔 파일 상단 CFG.dataEndpoint 에 직접 넣는다.</p>
      </div>
      <div class="field">
        <label for="cfgAi">Translation endpoint</label>
        <input id="cfgAi" type="url" inputmode="url" placeholder="https://your-worker.workers.dev/translate" autocomplete="off" />
        <p class="note">비우면 무료 번역기로 동작한다. 식품 용어 정확도는 떨어진다.</p>
      </div>
      <div class="field">
        <label for="cfgManual">Test with a FOOD QR address</label>
        <input id="cfgManual" type="url" inputmode="url" placeholder="https://foodqr.kr/01/08800336396509" autocomplete="off" />
      </div>
      <div class="row">
        <button class="btn ghost sm" id="btnManual" style="flex:1">Fetch</button>
        <button class="btn ghost sm" id="btnDemo" style="flex:1">Demo data</button>
      </div>
      <div class="row">
        <button class="btn ghost sm" id="btnSave" style="flex:1">Save</button>
        <button class="btn ghost sm" id="btnClear" style="flex:1">Clear</button>
      </div>
    </div>
  </details>

  <details class="drawer" id="diagDrawer">
    <summary>Diagnostics</summary>
    <div class="drawer-body">
      <div class="diag" id="diag"></div>
      <p style="font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.5">
        secure context가 no면 어떤 코드로도 카메라는 열리지 않는다. https 주소로 접속할 것.
      </p>
    </div>
  </details>

  <p class="foot" id="l_foot"></p>
</div>

function renderDiag(cam){

    ["secure context", ENV.secure ? "yes" : "no"],
    ["origin", location.origin === "null" ? "file (no origin)" : location.origin],
    ["getUserMedia", ENV.gum ? "yes" : "no"],

    ["in-app browser", ENV.inApp || "no"],
    ["data endpoint", dataEp() ? "set" : "not set"],

    ["language", state.ui.lang],

/* 카메라 화면 위 오버레이 안내. 사용자의 시선은 스캔 중
   프리뷰에 고정되므로, 안내는 반드시 프리뷰 "안"에 띄운다.
   pulse=true 면 문구 교체 시 살짝 커졌다 돌아와 시선을 끈다. */
function stageHint(msg, pulse){
  const el = $("stageHint");
  if(!msg){ el.hidden = true; return; }
  el.textContent = msg; el.hidden = false;
  el.classList.remove("pulse");
  if(pulse){ void el.offsetWidth; el.classList.add("pulse"); }
}

function loadScript(urls){
  return new Promise((res,rej)=>{ let i=0;
    (function next(){
      if(i>=urls.length) return rej(new Error("all CDNs failed"));
      const s=document.createElement("script"); s.src=urls[i++]; s.async=true;
      s.onload=res; s.onerror=()=>{s.remove();next();}; document.head.appendChild(s);
    })();
  });
}
let jsQRReady=null;
const ensureJsQR = () => window.jsQR ? Promise.resolve()
  : (jsQRReady = jsQRReady || loadScript(["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
                                          "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"]));

function cameraBlockedReason(){
  if(!ENV.secure) return { title:"This page is not on a secure connection",
    fixes: ENV.isFile
      ? ["file:// 로 열면 브라우저가 카메라를 차단한다.",
         "GitHub Pages(https://…github.io/…)에 올려서 열 것.",
         "로컬 테스트는 http://localhost 만 허용된다."]
      : ["http:// 주소로는 카메라가 열리지 않는다.","https:// 주소로 다시 접속할 것."] };
  if(ENV.inApp) return { title: ENV.inApp+" in-app browser blocks the camera",
    fixes:["우측 상단 메뉴에서 '다른 브라우저로 열기' 선택",
           "또는 '사진으로 대신하기'를 쓰면 인앱에서도 동작한다."] };
  if(!ENV.gum) return { title:"This browser has no camera API", fixes:["Chrome 또는 Safari 최신 버전에서 열 것."] };
  return null;
}

/* ------------------------------------------------------------
   [FIX] 멀티렌즈 안드로이드(갤럭시) 대응
   갤럭시는 후면 렌즈 3~5개(메인·초광각·매크로·뎁스)를 전부
   "environment"로 노출한다. facingMode만 주면 크롬이 그중
   아무거나 — 종종 AF가 없는 고정초점 렌즈 — 를 고른다.
   증상: 초점이 QR에 안 붙고 거리를 바꿔도 무의미.
   대응 ① 열린 트랙에 continuous AF 강제
        ② AF 없는 렌즈면 다른 후면 렌즈로 자동 재오픈
        ③ 그래도 빗나가면 '렌즈 전환' 버튼으로 수동 순환
   ------------------------------------------------------------ */
const FIXED_LENS = /ultra|wide[\s-]?angle|macro|depth|tele|bokeh|0\.5/i;

async function applyFocus(track){
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous"))
      await track.applyConstraints({ advanced:[{ focusMode:"continuous" }] });
    return caps;
  }catch(e){ return {}; }
}

async function listBackCams(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d => d.kind === "videoinput");
    const back = cams.filter(d => /back|rear|environment|후면/i.test(d.label));
    return back.length ? back : cams;
  }catch(e){ return []; }
}

function openById(id){
  return navigator.mediaDevices.getUserMedia({
    video:{ deviceId:{ exact:id }, width:{ideal:1920}, height:{ideal:1080} }, audio:false
  });
}

async function swapTrack(deviceId){
  const s = await openById(deviceId);                       // 새 렌즈 먼저 확보
  state.camera.stream.getTracks().forEach(t => t.stop());   // 성공 시에만 기존 해제
  state.camera.stream = s;
  state.camera.track  = s.getVideoTracks()[0];
  state.camera.torchOn = false;
  video.srcObject = s;
  await video.play().catch(()=>{});
  const caps = await applyFocus(state.camera.track);
  $("btnTorch").hidden = !("torch" in caps);
  $("btnTorch").style.background = ""; $("btnTorch").style.color = "";
  return caps;
}

/* 권한 승인 뒤 호출: 라벨이 보이므로 렌즈를 판별할 수 있다 */
async function ensureFocusableTrack(){
  const caps  = await applyFocus(state.camera.track);
  const label = state.camera.track.label || "";
  const noAF  = !(Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous"));

  state.camera.backCams = await listBackCams();

  const curId   = (state.camera.track.getSettings && state.camera.track.getSettings().deviceId) || "";
  const savedId = localStorage.getItem("flr.cam");
  const saved   = state.camera.backCams.find(d => d.deviceId === savedId);

  let targetId = "";
  if (saved && saved.deviceId !== curId) targetId = saved.deviceId;          // 사용자가 고른 렌즈 우선
  else if (noAF || FIXED_LENS.test(label)){                                  // 고정초점 렌즈로 열렸다면
    const alt = state.camera.backCams.find(d => d.deviceId !== curId && !FIXED_LENS.test(d.label));
    if (alt) targetId = alt.deviceId;
  }
  if (!targetId) return;
  try{ await swapTrack(targetId); }catch(e){ /* 실패 시 기존 트랙 유지 */ }
}

/* 스캔 루프가 호출: 다음 후면 렌즈로 자동 전환.
   사용자 조작 없음 — "이 렌즈로 충분히 시도했는데 실패"가 전환 신호다. */
async function nextLens(){
  const cams = state.camera.backCams.length ? state.camera.backCams : await listBackCams();
  if (cams.length < 2 || !state.camera.track) return false;
  const curId = (state.camera.track.getSettings && state.camera.track.getSettings().deviceId) || "";
  const i = cams.findIndex(d => d.deviceId === curId);
  const next = cams[(i + 1) % cams.length];
  try{
    stageHint(T().adjust);                       // 화면이 순간 바뀌는 이유를 알린다
    await swapTrack(next.deviceId);
    stageHint(T().guide, true);                  // 전환 후: 중립 안내로 복귀 (방향 안내는 루프가 재판정)
    const st = state.camera.track.getSettings ? state.camera.track.getSettings() : {};
    renderDiag("running " + (st.width ? st.width + "×" + st.height : "") +
               " · lens " + ((i + 1) % cams.length + 1) + "/" + cams.length);
    return true;
  }catch(e){ return false; }
}

async function startCamera(){
  state.scan.lastQR = "";
  state.camera.lensTried = 0;
  state.camera.qrLevel = 0;
  state.camera.qrFailCount = 0;
  state.camera.lastLevelChange = performance.now();

  quiet(); $("resultSec").hidden = true;
  const blocked = cameraBlockedReason();
  if(blocked){ say("err",blocked.title,"",blocked.fixes); renderDiag("blocked"); return; }

  $("btnStart").disabled = true;
  // iOS Safari는 속성만으로 부족하다. 프로퍼티로도 강제해야 인라인 재생된다.
  video.setAttribute("playsinline",""); video.setAttribute("webkit-playsinline","");
  video.playsInline = true; video.muted = true; video.autoplay = true;

  const attempts = [
    { video:{ facingMode:{exact:"environment"}, width:{ideal:1920}, height:{ideal:1080} }, audio:false },
    { video:{ facingMode:{ideal:"environment"}, width:{ideal:1280} }, audio:false },
    { video:true, audio:false }
  ];
  let stream=null,lastErr=null;
  for(const c of attempts){ try{ stream = await navigator.mediaDevices.getUserMedia(c); break; }catch(e){ lastErr=e; } }

  if(!stream){
    $("btnStart").disabled=false;
    const name=(lastErr&&lastErr.name)||"";
    const map={
      NotAllowedError:["주소창 자물쇠 아이콘 → 카메라 → 허용",
                       "iOS: 설정 → Safari → 카메라 → 확인/허용",
                       "Android: 설정 → 앱 → Chrome → 권한 → 카메라"],
      NotFoundError:["사용 가능한 카메라를 찾지 못했다.","'사진으로 대신하기'를 사용할 것."],
      NotReadableError:["다른 앱이 카메라를 점유 중이다. 종료 후 재시도."],
      OverconstrainedError:["후면 카메라를 찾지 못했다. 새로고침하면 전면으로 재시도한다."],
      SecurityError:["보안 정책으로 차단되었다. https 주소인지 확인할 것."]
    };
    say("err","Camera did not open"+(name?" ("+name+")":""),"",map[name]||["다시 시도하거나 '사진으로 대신하기'를 사용할 것."]);
    renderDiag("error: "+name); return;
  }

  state.camera.stream=stream; state.camera.track=stream.getVideoTracks()[0];
  video.srcObject=stream;
  try{ await video.play(); }
  catch(e){
    say("warn","Tap the video to start","",["화면을 한 번 터치하면 재생된다."]);
    $("stage").addEventListener("click",()=>video.play().catch(()=>{}),{once:true});
  }
  video.hidden=false; preview.hidden=true; $("idle").hidden=true;
  $("reticle").hidden=false; $("badge").hidden=false;
  $("btnStop").hidden=false; $("btnStart").hidden=true;

  // [FIX] AF 없는 렌즈로 열렸으면 여기서 메인 렌즈로 교체된다
  await ensureFocusableTrack();

  const caps = state.camera.track.getCapabilities ? state.camera.track.getCapabilities() : {};
  $("btnTorch").hidden = !("torch" in caps);
  const st = state.camera.track.getSettings ? state.camera.track.getSettings() : {};
  renderDiag("running "+(st.width?st.width+"×"+st.height:""));
  say("busy", T().scanning, ""); stageHint(T().guide); startQRLoop();
}

function stopCamera(){
  state.camera.scanning=false;
  if(state.camera.rafId) cancelAnimationFrame(state.camera.rafId);
  if(state.camera.stream) state.camera.stream.getTracks().forEach(t=>t.stop());
  state.camera.stream=null; state.camera.track=null; state.camera.torchOn=false;
  video.srcObject=null; video.hidden=true;
  $("reticle").hidden=true; $("badge").hidden=true; stageHint("");
  $("btnStop").hidden=true; $("btnTorch").hidden=true;
  $("btnStart").hidden=false; $("btnStart").disabled=false;
  $("idle").hidden=false; renderDiag("stopped");
}
async function toggleTorch(){
  if(!state.camera.track) return;
  try{
    state.camera.torchOn=!state.camera.torchOn;
    await state.camera.track.applyConstraints({ advanced:[{ torch: state.camera.torchOn }] });
    $("btnTorch").style.background = state.camera.torchOn ? "var(--ink)" : "";
    $("btnTorch").style.color = state.camera.torchOn ? "#fff" : "";
  }catch(e){ $("btnTorch").hidden = true; }
}

/* ============================================================
   3. QR DECODE
   ============================================================ */
let detector=null;
const cv = document.createElement("canvas");
const ctx = cv.getContext("2d", {willReadFrequently: true});
async function decodeFrom(source,w,h){
  // [FIX] 네이티브 디텍터(ML Kit) 우선.
  // 하드웨어 가속 + 캔버스 복사 없이 원본 해상도 사용 + 약한 블러에도 강하다.
  // 안드로이드에서 jsQR보다 먼저 성공하는 경우가 많아 인식 지연을 크게 줄인다.
  if(ENV.barcode){
    try{
      if(!detector) detector = new BarcodeDetector({ formats:["qr_code"] });
      const c = await detector.detect(source);
      if(c && c.length) return c[0].rawValue;
    }catch(e){}
  }

  // 폴백: jsQR (iOS Safari 등 BarcodeDetector 미지원 환경)
  await ensureJsQR();
  cv.width=w;
  cv.height=h;
  ctx.drawImage(source,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h);
  const r=window.jsQR(img.data,w,h,{inversionAttempts:"attemptBoth"});
  return r ? r.data : "";
}

/* [FIX] 프레임 선명도 측정 — 고정초점(블러) 렌즈 조기 감지용.
   decodeFrom 이 실패하며 캔버스에 그려둔 마지막 프레임의
   중앙부를 4px 간격으로 서브샘플해 수평 그래디언트 평균을 낸다.
   초점이 맞은 프레임은 QR·글자의 경계 때문에 값이 크고,
   고정초점 렌즈의 근접 블러 프레임은 지속적으로 낮게 유지된다. */
function frameSharpness(){
  try{
    const w=cv.width, h=cv.height;
    if(!w || !h) return 999;
    const d=ctx.getImageData(0,0,w,h).data;
    let sum=0, n=0;
    const x0=w>>2, x1=(w*3)>>2, y0=h>>2, y1=(h*3)>>2;
    for(let y=y0; y<y1; y+=4){
      const row=y*w;
      for(let x=x0; x<x1-4; x+=4){
        const i=(row+x)*4, j=i+16;
        const g=(d[i]+d[i+1]+d[i+2])-(d[j]+d[j+1]+d[j+2]);
        sum += g<0 ? -g : g; n++;
      }
    }
    return n ? sum/n : 999;
  }catch(e){ return 999; }
}

function startQRLoop()
{
  state.camera.scanning=true
  const sizes = [360, 480, 640, 720];

  let lastScan = 0;

  state.camera.qrLevel = 0;
  state.camera.lastLevelChange = performance.now();

  // [FIX] 속도 예산: 정상 케이스 1~2초, 최악 케이스도 4초 안쪽.
  const scanStart  = performance.now();
  let blurSince    = 0;      // 흐린 프레임이 이어지기 시작한 시각
  let lastSharp    = -1;     // 최근 측정한 프레임 선명도 (-1: 미측정)
  let sharpSkip    = 0;      // 선명도 측정은 실패 3프레임당 1회 (readback 비용 절감)
  let hintKind     = "";     // 현재 표시 중인 안내 종류 (back/near/slow)
  let hintAt       = 0;      // 마지막 안내 갱신 시각
  let hintVibed    = false;  // 주의 환기 진동은 한 번만
  const BLUR_TH    = 15;     // frameSharpness 이하이면 블러로 간주 (보수적)
  const BLUR_MS    = 1300;   // 이 시간 이상 지속되면 렌즈 전환

  const tick = async ()=>{

    try{

      if(!state.camera.scanning) return;

      if (video.readyState < 2 || !video.videoWidth)
        return;

      // 약 15fps만 디코딩
      const now = performance.now();

      if (now - lastScan < 70)
        return;

      lastScan = now;

      const max = sizes[state.camera.qrLevel];

      const scale = Math.min(
        1,
        max / Math.max(video.videoWidth, video.videoHeight)
      );

      const width = Math.round(video.videoWidth * scale);

      const height = Math.round(video.videoHeight * scale);

      const data = await decodeFrom(video, width, height);

      if (data && data !== state.scan.lastQR) {

        state.scan.lastQR = data;

        // 다음 스캔은 다시 가장 작은 해상도부터
        state.camera.qrLevel = 0;
        state.camera.lastLevelChange = performance.now();

        state.camera.scanning = false;

        // [FIX] 인식에 성공한 렌즈를 기억 → 다음부터는 이 렌즈로 바로 연다
        try{
          const id = state.camera.track && state.camera.track.getSettings
            ? state.camera.track.getSettings().deviceId : "";
          if (id) localStorage.setItem("flr.cam", id);
        }catch(e){}

        if (navigator.vibrate)
          navigator.vibrate(40);

        stopCamera();

        await handleQR(data);

        return;
      }

      // ── 실패 프레임 처리 ──────────────────────────────────

      const canRotate =
        state.camera.backCams.length > 1 &&
        state.camera.lensTried < state.camera.backCams.length - 1;

      // 선명도 상시 추적 (jsQR 폴백이 캔버스에 남긴 프레임 재활용).
      // 렌즈 전환 판단과 아래 적응형 안내가 같은 값을 공유한다.
      if (cv.width && (sharpSkip++ % 3 === 0)) lastSharp = frameSharpness();

      // [FIX] 블러 조기 감지: 선명도가 낮은 상태로 이어지면
      // 해상도를 올려봐야 소용없다(고정초점 블러는 해상도 문제가 아니다)
      // → 즉시 렌즈 전환. 잘못된 렌즈를 ~9초가 아니라 ~1.5초 만에 포기.
      if (canRotate && lastSharp >= 0) {
        if (lastSharp < BLUR_TH) {
          if (!blurSince) blurSince = now;
          if (now - blurSince > BLUR_MS) {
            blurSince = 0; hintKind = ""; hintAt = now;
            state.camera.lensTried++;
            state.camera.qrLevel = 0;
            await nextLens();
            state.camera.lastLevelChange = performance.now();
            state.camera.rafId = requestAnimationFrame(tick);
            return;
          }
        } else {
          blurSince = 0;
        }
      }

      // 0.9초 동안 못 찾으면 다음 해상도로 (1.5초 → 0.9초 단축)
      if (
        now - state.camera.lastLevelChange > 900 &&
        state.camera.qrLevel < sizes.length - 1
      ) {

        state.camera.qrLevel++;

        state.camera.lastLevelChange = now;
      }

      // [FIX] 720에서 1.2초 더 실패하면 (기존 5초 대기 삭제):
      // 다른 후면 렌즈가 남았으면 렌즈 전환, 전부 돌았으면 360부터 리셋
      if (
        state.camera.qrLevel === sizes.length - 1 &&
        now - state.camera.lastLevelChange > 1200
      ) {

        state.camera.qrLevel = 0;

        state.camera.lastLevelChange = now;

        if (canRotate) {
          hintKind = ""; hintAt = now;
          state.camera.lensTried++;
          await nextLens();
          state.camera.lastLevelChange = performance.now(); // 전환 소요시간 보정
        }
      }

      // [FIX] 2.0초째부터 적응형 안내 — 실패 원인은 "너무 가까움(블러)"
      // 아니면 "너무 멂(QR이 작게 찍힘)" 둘 중 하나이고, 선명도로 구분된다.
      //   흐린데 실패 중  → 너무 가깝다 → "조금 멀리"
      //   선명한데 실패 중 → 너무 멀다  → "조금 가까이"
      //   측정 불가(네이티브 경로만 도는 중) → 일반 안내 "10~15cm 고정"
      // 고정 문구가 아니라 교정 "방향"을 주므로, 사용자가 어차피 거리를
      // 바꿀 거라면 그 움직임이 정답 쪽을 향하게 된다. 상황이 바뀌면
      // (1.5초 간격으로) 문구도 따라 바뀐다.
      if (now - scanStart > 2000 && now - hintAt > 1500) {
        const kind = lastSharp < 0 ? "slow" : (lastSharp < BLUR_TH ? "back" : "near");
        if (kind !== hintKind) {
          hintKind = kind; hintAt = now;
          stageHint(T()[kind] || T().slow, true);
          if (!hintVibed && navigator.vibrate) { hintVibed = true; navigator.vibrate(15); }
        }
      }

    } 
    catch (e) {
      console.error(e);
    }
    finally{
      if(state.camera.scanning){
      state.camera.rafId=requestAnimationFrame(tick);
      }
    }
  }
  state.camera.rafId = requestAnimationFrame(tick);
}

function loadImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function showPreview(img){
  const MAX=1400,s=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
  preview.width=Math.round(img.naturalWidth*s); preview.height=Math.round(img.naturalHeight*s);
  preview.getContext("2d").drawImage(img,0,0,preview.width,preview.height);
  preview.hidden=false; video.hidden=true; $("idle").hidden=true;
}

   ============================================================ */
const isFoodQR = u => { try{ return /(^|\.)foodqr\.kr$/i.test(new URL(u).hostname); }catch(e){ return false; } };

function pickBarcode(input){
  if(!input) return "";
  const s = String(input).trim();
  if(/^\d{8,14}$/.test(s)) return s.padStart(14,"0");
  try{
    const segs = new URL(s).pathname.split("/").filter(Boolean);
    const i = segs.indexOf("01");                       // AI 01 = GTIN
    if(i >= 0 && /^\d{8,14}$/.test(segs[i+1] || "")) return segs[i+1].padStart(14,"0");
    const d = segs.find(x => /^\d{8,14}$/.test(x));
    return d ? d.padStart(14,"0") : "";
  }catch(e){
    const m = s.match(/\d{8,14}/);
    return m ? m[0].padStart(14,"0") : "";
  }
}

/* ============================================================
   5. 원재료 HTML 파서
   prvwCn 은 <a><span>이름(<p class="bold">원산지</p>)</span></a> 의 나열이고
   대괄호 [ ] 가 복합원재료의 하위 항목을 나타낸다.
   ============================================================ */
function parseMaterials(html){
  if(!html) return [];
  const doc = new DOMParser().parseFromString(html, "text/html");
  const out = []; let depth = 0;
  const walk = node => {
    for(const n of [...node.childNodes]){
      if(n.nodeType === 3){                              // 텍스트: 괄호 깊이만 센다
        for(const ch of n.nodeValue){
          if(ch === "[") depth++;
          else if(ch === "]") depth = Math.max(0, depth-1);
        }
      } else if(n.tagName === "A"){
        const bold = n.querySelector("p.bold, p");
        const origin = bold ? bold.textContent.replace(/\s+/g," ").trim() : "";
        const full = n.textContent.replace(/\s+/g," ").trim();
        const name = origin ? full.replace("("+origin+")","").replace(/\(\s*\)$/,"").trim() : full;
        let canonical = "";
        try{
          const href = n.getAttribute("href") || "";
          canonical = decodeURIComponent(new URL(href).searchParams.get("query") || "");
        }catch(e){}
        if(name) out.push({ depth: Math.min(depth,2), name, origin, canonical });
      } else walk(n);
    }
  };
  walk(doc.body);
  return out;
}

/* 원재료 한 줄이 어떤 알레르겐에 걸리는지 */
function classify(m, officialSet){
  const hay = [m.name, m.origin, m.canonical].join(" ");
  const kr = KR_ALLERGENS.filter(a => hay.includes(a));
  const official = kr.some(a => officialSet.has(a));
  const intl = INTL_ONLY.filter(g => g.hits.some(h => hay.includes(h))).map(g => g.key);
  return { official: official || kr.length > 0, intl };
}

async function fetchRecord(url){
  const ep = dataEp();
  if(!ep) throw new Error("NO_ENDPOINT");
  const r = await fetch(ep, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ url, barcode: pickBarcode(url) })
  });
  let j = null;
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && j.error) || ("HTTP "+r.status));
  return j;
}

async function gtx(lines, target){
  if(target === "ko") return lines.slice();
  const out=[]; let buf=[], len=0;
  const flush = async ()=>{
    if(!buf.length) return;
    const q = buf.join("\n");
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl="+
      encodeURIComponent(target)+"&dt=t&q="+encodeURIComponent(q);
    try{
      const j = await (await fetch(url)).json();
      const parts = (j[0]||[]).map(s=>s[0]).join("").split("\n");
      if(parts.length === buf.length) out.push(...parts);
      else out.push(...buf.map((_,i)=>parts[i]||buf[i]));
    }catch(e){ out.push(...buf); }
    buf=[]; len=0;
  };
  for(const l of lines){ if(len + l.length > 900) await flush(); buf.push(l); len += l.length+1; }
  await flush();
  return out;
}

async function claude(lines, target){
  const ep = aiEp();
  if(!ep || target === "ko") return null;
  const body = { model:"claude-sonnet-5", max_tokens:2000, messages:[{ role:"user", content:
`Translate each line of this Korean food label into ${LANG_NAME[target]||target}.

Rules:
- Return ONLY a JSON array of strings, same length and same order as the input. No fence, no commentary.
- These are 식품 표시사항 terms. Use the conventional food-labelling wording of the target language, not a literal gloss.
  e.g. 산도조절제 → acidity regulator, 정제소금 → refined salt, 향미증진제 → flavour enhancer, 아황산류 → sulphites.
- Keep numbers, units and percentages exactly as printed.
- Origin strings like "밀:미국산,호주산" become "wheat: USA, Australia".

INPUT:
${JSON.stringify(lines)}` }] };

  const res = await fetch(ep, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  if(!res.ok) throw new Error("translate HTTP "+res.status);
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").join("").trim();
  const arr = JSON.parse(text.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim());
  return (Array.isArray(arr) && arr.length === lines.length) ? arr : null;
}

async function translate(lines, target){
  if(!lines.length) return [];
  try{ const a = await claude(lines, target); if(a) return a; }catch(e){}
  return gtx(lines, LANGS.find(l=>l.code===target)?.g || target);
}

async function handleQR(text){
  $("resultSec").hidden = true; quiet();
  if(!/^https?:\/\//i.test(text) && !/^\d{8,14}$/.test(text.trim())){
    say("warn","This QR is not a FOOD QR","",[text.slice(0,120)]); return;
  }
  state.scan.target = text.trim();
  $("btnOriginal").hidden = !/^https?:/i.test(state.scan.target);
  $("btnOriginal").onclick = ()=> window.open(state.scan.target,"_blank","noopener");

  if(/^https?:/i.test(state.scan.target) && !isFoodQR(state.scan.target)){
    say("warn","Not a FOOD QR","",["푸드QR이 아닌 QR이다. 태극마크 + FOOD QR 표기를 확인할 것."]); return;
  }
  const bc = pickBarcode(state.scan.target);
  if(!bc){ say("err","No barcode in this QR","",[state.scan.target.slice(0,120)]); return; }

  say("busy", T().fetching, "");
  try{
    const rec = await fetchRecord(state.scan.target);
    say("busy", T().translating, "");
    state.record.lastRecord = rec;
    await render(rec);
  }catch(e){
    if(String(e.message) === "NO_ENDPOINT"){
      say("warn","Data endpoint is not set","",
        ["Setup 을 열고 워커의 /foodqr 주소를 입력할 것.","'Demo data' 로 화면만 먼저 확인할 수 있다."]);
      return;
    }
    say("err","Could not get the record","",[String(e.message).slice(0,160), "barcode: "+bc]);
  }
}

   async function render(rec, scroll = true) {
    const vm = await prepareRenderData(rec);

    const html = [
      renderHeader(vm),
      renderOfficial(vm),
      renderIngredients(vm),
      renderNutrition(vm),
      renderInfo(vm)
    ].filter(Boolean).join("");

    showResult(html, scroll);
  }
  
  async function prepareRenderData(rec) {
    const t = T();

    const mats = parseMaterials(rec.materialHtml);

    const official = (rec.allergens || []).map(String);

    const officialSet = new Set(
      official.flatMap(a =>
        KR_ALLERGENS.filter(k => a.includes(k))
      )
    );

    const intlFound = [
      ...new Set(
        mats.flatMap(m => classify(m, officialSet).intl)
      )
    ];

    const nut = rec.nutrition || [];

    const src = [
      rec.product || "",
      rec.maker || "",

      ...mats.map(m => m.name),
      ...mats.map(m => m.origin || ""),

      ...official,
      ...intlFound,

      ...nut.map(n => n.name || ""),

      rec.storage || "",
      rec.caution || "",
      rec.packaging || ""
    ];

    const tr = await translate(src, state.ui.lang);

    let i = 0;
    const take = () => tr[i++] ?? "";

    return {

      t,
      rec,

      mats,
      official,
      officialSet,
      intlFound,
      nut,

      productTr: take(),
      makerTr: take(),

      nameTr: mats.map(() => take()),
      originTr: mats.map(() => take()),

      officialTr: official.map(() => take()),
      intlTr: intlFound.map(() => take()),

      nutTr: nut.map(() => take()),

      storageTr: take(),
      cautionTr: take(),
      packagingTr: take()

    };
  }

  function renderHeader(vm) {
    const { rec, productTr } = vm;

    const out = [];

    out.push(`

    <b>Official record</b>

  function renderOfficial(vm) {
    const {

      official,

      intlFound,
      intlTr
    } = vm;

    const out = [];

    if (official.length) {

      out.push(`
    <div class="block">
    <p class="lbl">${esc(t.official)}</p>
    <p class="sub">${esc(t.officialSub)}</p>

    <div class="chips">

    ${official.map((a, k) => `
    <span class="chip">
    ${esc(officialTr[k] || a)}
    <span class="ko">${esc(a)}</span>
    </span>
    `).join("")}

    </div>
    </div>`);

    }

    if (intlFound.length) {

      out.push(`
    <div class="block">
    <p class="lbl">${esc(t.intl)}</p>
    <p class="sub">${esc(t.intlSub)}</p>

    <div class="chips">

    ${intlFound.map((a, k) => `
    <span class="chip amber">
    ${esc(intlTr[k] || a)}
    <span class="ko">${esc(a)}</span>
    </span>
    `).join("")}

    </div>
    </div>`);

    }

    return out.join("");
  }

  function renderIngredients(vm) {
    const {
      t,
      mats,
      officialSet,
      nameTr,
      originTr
    } = vm;

    if (!mats.length) return "";

    return `
    <div class="block">

    <p class="lbl">${esc(t.ingredients)}</p>

    ${mats.map((m, k) => {

    const c = classify(m, officialSet);

    return `

  }

    } = vm;

    if (!nut.length) return "";

    ? `<p class="sub">${esc(rec.nutritionBasis)}</p>`

    <table class="nut">

    <p class="para">

    ${esc(tr || ko)}

    <span class="ko">
    ${esc(ko)}
    </span>

    </p>

    </div>`);

    });

    return out.join("");
  }

(function init(){
  const param = new URLSearchParams(location.search).get("lang");
  const saved = localStorage.getItem("flr.lang");
  const nav = navigator.language || "en";
  const has = c => LANGS.some(l => l.code.toLowerCase() === String(c).toLowerCase());
  state.ui.lang = has(param) ? param : (saved || (LANGS.find(l =>
    nav.toLowerCase().startsWith(l.code.toLowerCase().slice(0,2)))?.code) || "en");

  $("cfgData").value = localStorage.getItem("flr.data") || CFG.dataEndpoint;
  $("cfgAi").value   = localStorage.getItem("flr.ai")   || CFG.aiEndpoint;

  applyLang(); renderDiag("idle");
  const blocked = cameraBlockedReason();
  if(blocked){ say("warn", blocked.title, "", blocked.fixes); $("diagDrawer").open = true; }
  window.addEventListener("pagehide", stopCamera);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopCamera(); });
})();
