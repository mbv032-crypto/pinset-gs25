<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#ffffff" />
<meta name="format-detection" content="telephone=no" />
<title>FOOD LABEL READER</title>
<meta property="og:title" content="FOOD LABEL READER" />
<meta property="og:description" content="Scan the FOOD QR. Read the label in your language." />

<!--
  ============================================================
  BUILD NOTES  — redirect build
  ============================================================
  FLOW
    언어 선택 → 카메라 → 푸드QR 인식 → 번역 프록시로 이동
    서버 없음. 키 없음. 파일 하나로 끝.

  번역 프록시 주소 형식
    https://foodqr.kr/01/123
    → https://foodqr-kr.translate.goog/01/123?_x_tr_sl=ko&_x_tr_tl=en&_x_tr_hl=en
    호스트에서 '-'는 '--'로, '.'은 '-'로 치환한다.

  링크에 언어를 실을 수 있다
    ?lang=ja 로 열면 일본어가 선택된 상태로 시작.
    인쇄물마다 다른 QR을 쓰고 싶을 때.

  CAMERA
    getUserMedia는 secure context 전용. https:// 또는 localhost.
    file:// 과 http://192.168.x.x 는 무조건 실패한다.
    카카오톡·인스타 인앱 브라우저도 차단 → 사진 업로드로 우회.
    상태는 하단 Diagnostics에서 확인.
  ============================================================
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
:root{
  --bg:#ffffff; --bg-sub:#f6f7f9;
  --ink:#101828; --ink-2:#475467; --ink-3:#98a2b3;
  --line:#e4e7ec; --line-2:#d0d5dd;
  --accent:#0f77e2; --cyan:#00d4ea;
  --ok:#067647; --ok-bg:#ecfdf3;
  --warn:#b54708; --warn-bg:#fffaeb;
  --err:#b42318; --err-bg:#fef3f2;
  --r:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
[hidden]{display:none !important}
.wrap{width:min(100%,520px);margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:3px;display:grid;
  place-items:center;font-size:10px;font-weight:800;letter-spacing:-0.06em;flex:none}
.top h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

section{padding:18px 16px;border-bottom:1px solid var(--line)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}

.langs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.langs::-webkit-scrollbar{display:none}
.lang{flex:none;border:1px solid var(--line-2);background:var(--bg);border-radius:var(--r);
  padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.lang[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}

.stage{position:relative;aspect-ratio:3/4;max-height:56vh;background:#0c1015;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;display:grid;place-items:center}
.stage video,.stage canvas.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0c1015}
.stage .idle{color:#68727f;font-size:12.5px;text-align:center;padding:0 28px;line-height:1.6;z-index:1}
.reticle{position:absolute;inset:0;pointer-events:none}
.scanline{position:absolute;left:14%;right:14%;height:1px;background:var(--cyan);opacity:.9;
  box-shadow:0 0 6px var(--cyan);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{top:22%}50%{top:76%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}
.badge{position:absolute;left:10px;top:10px;z-index:2;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:#cfe9ff;background:rgba(12,16,21,.72);border:1px solid rgba(255,255,255,.16);border-radius:3px;padding:3px 6px}

.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);
  padding:12px 10px;font-size:14px;font-weight:700;cursor:pointer}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line-2)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:9px 10px;font-size:13px;font-weight:600;flex:0 0 auto}

.status{margin-top:10px;border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);
  padding:10px 12px;font-size:13px;background:var(--bg-sub);color:var(--ink-2)}
.status.ok{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.status.warn{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.status.err{border-left-color:var(--err);background:var(--err-bg);color:var(--err)}
.status.busy{border-left-color:var(--accent)}
.status b{display:block;margin-bottom:2px}
.status .fix{margin:6px 0 0;padding-left:16px;font-size:12.5px}
.status .fix li{margin:2px 0}

.hit{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg-sub)}
.hit .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.hit .u{font-family:var(--mono);font-size:11.5px;word-break:break-all;margin-top:5px;color:var(--ink-2)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px}

.toggle{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--ink-2);cursor:pointer}
.toggle input{width:17px;height:17px;accent-color:var(--ink);flex:none}

details.drawer{border-top:1px solid var(--line)}
details.drawer > summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
details.drawer > summary::-webkit-details-marker{display:none}
details.drawer > summary::after{content:"+";margin-left:auto;font-size:15px;color:var(--ink-3)}
details.drawer[open] > summary::after{content:"–"}
.drawer-body{padding:0 16px 18px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 11px;
  background:var(--bg);font-size:14px;font-family:var(--mono)}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.diag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.diag div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line)}
.diag div:last-child{border-bottom:0}
.diag span:first-child{color:var(--ink-3)}
.diag span:last-child{text-align:right;word-break:break-all}
.diag .no{color:var(--err);font-weight:700}
.diag .yes{color:var(--ok);font-weight:700}
.foot{padding:16px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="mark">FL</div>
    <h1>Food Label Reader</h1>
  </header>

  <section>
    <p class="lbl" id="l_lang">Your language</p>
    <div class="langs" id="langs" role="group"></div>
  </section>

  <section>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay hidden></video>
      <canvas class="preview" id="preview" hidden></canvas>
      <div class="idle" id="idle">Camera off</div>
      <div class="reticle" id="reticle" hidden>
        <svg viewBox="0 0 300 400" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
          <path d="M42 96 V70 H72 M228 70 H258 V96 M258 304 V330 H228 M72 330 H42 V304"
                fill="none" stroke="#00d4ea" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="scanline"></div>
      </div>
      <div class="badge" id="badge" hidden>LIVE</div>
    </div>

    <div class="row">
      <button class="btn" id="btnStart">Start camera</button>
      <button class="btn ghost sm" id="btnTorch" hidden>Flash</button>
      <button class="btn ghost sm" id="btnStop" hidden>Stop</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="btnPick">Use a photo instead</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden />
    <input type="file" id="filePick" accept="image/*" hidden />

    <label class="toggle"><input type="checkbox" id="autoGo" checked /><span id="l_auto">Open automatically after scanning</span></label>
    <div class="status" id="status" hidden></div>
  </section>

  <section id="hitSec" hidden>
    <div class="hit">
      <div class="k" id="l_found">FOOD QR</div>
      <div class="u" id="hitUrl"></div>
    </div>
    <div class="row">
      <button class="btn accent" id="btnGo">Open in my language</button>
    </div>
    <div class="row">
      <button class="btn ghost sm" id="btnOriginal" style="flex:1">Korean page</button>
      <button class="btn ghost sm" id="btnAgain" style="flex:1">Scan another</button>
    </div>
    <p class="count" id="count" hidden></p>
  </section>

  <details class="drawer">
    <summary>Manual entry</summary>
    <div class="drawer-body">
      <div class="field">
        <label for="manual">Paste a FOOD QR address</label>
        <input id="manual" type="url" inputmode="url" placeholder="https://foodqr.kr/01/…" autocomplete="off" />
      </div>
      <div class="row"><button class="btn ghost sm" id="btnManual" style="flex:1">Open</button></div>
    </div>
  </details>

  <details class="drawer" id="diagDrawer">
    <summary>Diagnostics</summary>
    <div class="drawer-body">
      <div class="diag" id="diag"></div>
      <p style="font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.5">
        secure context가 no면 어떤 코드로도 카메라는 열리지 않는다. https 주소로 접속할 것.
      </p>
    </div>
  </details>

  <p class="foot" id="l_foot">
    Machine translation of the official Korean food-safety page. For allergies or medical restrictions, check the Korean text on the package or ask staff.
  </p>
</div>

<script>
"use strict";

const LANGS = [
  { code:"en", label:"English" }, { code:"ja", label:"日本語" },
  { code:"zh-CN", label:"简体中文" }, { code:"zh-TW", label:"繁體中文" },
  { code:"vi", label:"Tiếng Việt" }, { code:"th", label:"ไทย" },
  { code:"id", label:"Indonesia" }, { code:"ru", label:"Русский" },
  { code:"es", label:"Español" }, { code:"fr", label:"Français" },
  { code:"de", label:"Deutsch" }, { code:"mn", label:"Монгол" }
];

const UI = {
  en:{lang:"Your language",start:"Start camera",stop:"Stop",torch:"Flash",pick:"Use a photo instead",
      auto:"Open automatically after scanning",found:"FOOD QR",go:"Open in my language",
      korean:"Korean page",again:"Scan another",
      idle:"Point the camera at the FOOD QR on the package.",
      scanning:"Looking for the FOOD QR…",opening:"Opening in {n}…",
      foot:"Machine translation of the official Korean food-safety page. For allergies or medical restrictions, check the Korean text on the package or ask staff."},
  ko:{lang:"언어",start:"카메라 켜기",stop:"중지",torch:"플래시",pick:"사진으로 대신하기",
      auto:"인식되면 자동으로 열기",found:"푸드QR",go:"내 언어로 열기",
      korean:"원문 페이지",again:"다시 스캔",
      idle:"포장지의 푸드QR에 카메라를 맞추세요.",
      scanning:"푸드QR을 찾는 중…",opening:"{n}초 후 이동합니다…",
      foot:"식품의약품안전처 공식 페이지를 기계 번역합니다. 알레르기나 질환 관련 정보는 포장지의 한국어 원문을 확인하거나 매장 직원에게 문의하세요."},
  ja:{lang:"言語",start:"カメラを起動",stop:"停止",torch:"ライト",pick:"写真を使う",
      auto:"読み取ったら自動で開く",found:"FOOD QR",go:"自分の言語で開く",
      korean:"韓国語ページ",again:"もう一度",
      idle:"パッケージのFOOD QRにカメラを向けてください。",
      scanning:"FOOD QRを探しています…",opening:"{n}秒後に移動します…",
      foot:"韓国食品医薬品安全処の公式ページを機械翻訳します。アレルギーや疾患に関わる情報は韓国語の原文を確認するか店員にお尋ねください。"},
  "zh-CN":{lang:"语言",start:"开启相机",stop:"停止",torch:"闪光灯",pick:"改用照片",
      auto:"识别后自动打开",found:"FOOD QR",go:"用我的语言打开",
      korean:"韩文页面",again:"再扫一次",
      idle:"将镜头对准包装上的 FOOD QR。",
      scanning:"正在寻找 FOOD QR…",opening:"{n} 秒后跳转…",
      foot:"对韩国食品医药品安全处官方页面进行机器翻译。涉及过敏或疾病的信息请核对韩文原文或询问店员。"}
};
const T = () => UI[state.lang] || UI.en;

const state = { lang:"en", stream:null, track:null, scanning:false, rafId:null,
                torchOn:false, lastQR:"", target:"", timer:null };
const $ = id => document.getElementById(id);
const video = $("video"), preview = $("preview");

const ENV = (()=>{
  const ua = navigator.userAgent;
  const inApp =
    /KAKAOTALK/i.test(ua) ? "KakaoTalk" : /Instagram/i.test(ua) ? "Instagram" :
    /NAVER\(inapp/i.test(ua) ? "Naver" : /\bFBAN|\bFBAV/i.test(ua) ? "Facebook" :
    /Line\//i.test(ua) ? "LINE" : /DaumApps/i.test(ua) ? "Daum" : "";
  const isFile = location.protocol === "file:";
  return { isFile, secure: window.isSecureContext === true && !isFile,
    protocol: location.protocol,
    gum: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    barcode: typeof window.BarcodeDetector !== "undefined", inApp, ua };
})();

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function renderDiag(cam){
  const rows = [
    ["secure context", ENV.secure ? "yes" : "no"],
    ["origin", location.origin === "null" ? "file (no origin)" : location.origin],
    ["getUserMedia", ENV.gum ? "yes" : "no"],
    ["BarcodeDetector", ENV.barcode ? "native" : "jsQR fallback"],
    ["in-app browser", ENV.inApp || "no"],
    ["language", state.lang],
    ["camera", cam || "idle"],
    ["ua", ENV.ua.slice(0,80)]
  ];
  $("diag").innerHTML = rows.map(([k,v])=>{
    const cls = v==="no" ? "no" : (v==="yes"||v==="native") ? "yes" : "";
    return `<div><span>${k}</span><span class="${cls}">${esc(v)}</span></div>`;
  }).join("");
}
function say(kind,title,body,fixes){
  const el = $("status");
  el.hidden=false; el.className="status "+kind;
  el.innerHTML = `<b>${esc(title)}</b>${body?esc(body):""}` +
    (fixes&&fixes.length ? `<ul class="fix">${fixes.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>` : "");
}
const quiet = () => { $("status").hidden = true; };

function loadScript(urls){
  return new Promise((resolve,reject)=>{
    let i=0;
    (function next(){
      if(i>=urls.length) return reject(new Error("all CDNs failed"));
      const s=document.createElement("script"); s.src=urls[i++]; s.async=true;
      s.onload=resolve; s.onerror=()=>{ s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}
let jsQRReady=null;
const ensureJsQR = () => window.jsQR ? Promise.resolve()
  : (jsQRReady = jsQRReady || loadScript([
      "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
      "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"]));

/* ---------- camera ---------- */
function cameraBlockedReason(){
  if(!ENV.secure) return { title:"This page is not on a secure connection",
    fixes: ENV.isFile
      ? ["file:// 로 열면 브라우저가 카메라를 차단한다.",
         "GitHub Pages(https://…github.io/…)에 올려서 열 것.",
         "로컬 테스트는 http://localhost 만 허용된다."]
      : ["http:// 주소로는 카메라가 열리지 않는다.","https:// 주소로 다시 접속할 것."] };
  if(ENV.inApp) return { title: ENV.inApp + " in-app browser blocks the camera",
    fixes:["우측 상단 메뉴에서 '다른 브라우저로 열기' 선택",
           "또는 '사진으로 대신하기'를 쓰면 인앱에서도 동작한다."] };
  if(!ENV.gum) return { title:"This browser has no camera API", fixes:["Chrome 또는 Safari 최신 버전에서 열 것."] };
  return null;
}

async function startCamera(){
  quiet(); $("hitSec").hidden = true;
  const blocked = cameraBlockedReason();
  if(blocked){ say("err",blocked.title,"",blocked.fixes); renderDiag("blocked"); return; }

  $("btnStart").disabled = true;
  // iOS Safari는 속성만으로 부족하다. 프로퍼티로도 강제해야 인라인 재생된다.
  video.setAttribute("playsinline",""); video.setAttribute("webkit-playsinline","");
  video.playsInline = true; video.muted = true; video.autoplay = true;

  const attempts = [
    { video:{ facingMode:{exact:"environment"}, width:{ideal:1920}, height:{ideal:1080} }, audio:false },
    { video:{ facingMode:{ideal:"environment"}, width:{ideal:1280} }, audio:false },
    { video:true, audio:false }
  ];
  let stream=null, lastErr=null;
  for(const c of attempts){
    try{ stream = await navigator.mediaDevices.getUserMedia(c); break; }catch(e){ lastErr=e; }
  }
  if(!stream){
    $("btnStart").disabled = false;
    const name = (lastErr && lastErr.name) || "";
    const map = {
      NotAllowedError:["주소창 자물쇠 아이콘 → 카메라 → 허용",
                       "iOS: 설정 → Safari → 카메라 → 확인/허용",
                       "Android: 설정 → 앱 → Chrome → 권한 → 카메라"],
      NotFoundError:["사용 가능한 카메라를 찾지 못했다.","'사진으로 대신하기'를 사용할 것."],
      NotReadableError:["다른 앱이 카메라를 점유 중이다. 종료 후 재시도."],
      OverconstrainedError:["후면 카메라를 찾지 못했다. 새로고침하면 전면으로 재시도한다."],
      SecurityError:["보안 정책으로 차단되었다. https 주소인지 확인할 것."]
    };
    say("err","Camera did not open"+(name?" ("+name+")":""),"",map[name]||["다시 시도하거나 '사진으로 대신하기'를 사용할 것."]);
    renderDiag("error: "+name);
    return;
  }

  state.stream = stream; state.track = stream.getVideoTracks()[0];
  video.srcObject = stream;
  try{ await video.play(); }
  catch(e){
    say("warn","Tap the video to start","",["화면을 한 번 터치하면 재생된다."]);
    $("stage").addEventListener("click", ()=>video.play().catch(()=>{}), { once:true });
  }

  video.hidden=false; preview.hidden=true; $("idle").hidden=true;
  $("reticle").hidden=false; $("badge").hidden=false;
  $("btnStop").hidden=false; $("btnStart").hidden=true;
  const caps = state.track.getCapabilities ? state.track.getCapabilities() : {};
  $("btnTorch").hidden = !("torch" in caps);
  const st = state.track.getSettings ? state.track.getSettings() : {};
  renderDiag("running " + (st.width ? st.width+"×"+st.height : ""));
  say("busy", T().scanning, "");
  startQRLoop();
}

function stopCamera(){
  state.scanning=false;
  if(state.rafId) cancelAnimationFrame(state.rafId);
  if(state.stream) state.stream.getTracks().forEach(t=>t.stop());
  state.stream=null; state.track=null; state.torchOn=false;
  video.srcObject=null; video.hidden=true;
  $("reticle").hidden=true; $("badge").hidden=true;
  $("btnStop").hidden=true; $("btnTorch").hidden=true;
  $("btnStart").hidden=false; $("btnStart").disabled=false;
  $("idle").hidden=false;
  renderDiag("stopped");
}
async function toggleTorch(){
  if(!state.track) return;
  try{
    state.torchOn = !state.torchOn;
    await state.track.applyConstraints({ advanced:[{ torch: state.torchOn }] });
    $("btnTorch").style.background = state.torchOn ? "var(--ink)" : "";
    $("btnTorch").style.color = state.torchOn ? "#fff" : "";
  }catch(e){ $("btnTorch").hidden = true; }
}

/* ---------- decode ---------- */
let detector=null;
async function decodeFrom(source,w,h){
  if(ENV.barcode){
    try{
      if(!detector) detector = new BarcodeDetector({ formats:["qr_code"] });
      const codes = await detector.detect(source);
      if(codes && codes.length) return codes[0].rawValue;
      return "";
    }catch(e){}
  }
  await ensureJsQR();
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(source,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h);
  const r=window.jsQR(img.data,w,h,{inversionAttempts:"attemptBoth"});
  return r ? r.data : "";
}
function startQRLoop(){
  state.scanning = true;
  const MAX = 720;
  const tick = async ()=>{
    if(!state.scanning) return;
    if(video.readyState >= 2 && video.videoWidth){
      const s = Math.min(1, MAX/Math.max(video.videoWidth, video.videoHeight));
      const w = Math.round(video.videoWidth*s), h = Math.round(video.videoHeight*s);
      try{
        const data = await decodeFrom(video,w,h);
        if(data && data !== state.lastQR){
          state.lastQR = data; state.scanning = false;
          if(navigator.vibrate) navigator.vibrate(40);
          stopCamera(); handleQR(data); return;
        }
      }catch(e){}
    }
    state.rafId = requestAnimationFrame(tick);
  };
  state.rafId = requestAnimationFrame(tick);
}
function loadImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function showPreview(img){
  const MAX=1400, s=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
  preview.width=Math.round(img.naturalWidth*s); preview.height=Math.round(img.naturalHeight*s);
  preview.getContext("2d").drawImage(img,0,0,preview.width,preview.height);
  preview.hidden=false; video.hidden=true; $("idle").hidden=true;
}

/* ---------- redirect ---------- */
const isFoodQR = u => { try{ return /(^|\.)foodqr\.kr$/i.test(new URL(u).hostname); }catch(e){ return false; } };

function translatedUrl(u, lang){
  const x = new URL(u);
  const host = x.hostname.replace(/-/g,"--").replace(/\./g,"-");
  const q = new URLSearchParams(x.search);
  q.set("_x_tr_sl","ko"); q.set("_x_tr_tl",lang); q.set("_x_tr_hl",lang);
  return "https://" + host + ".translate.goog" + x.pathname + "?" + q.toString();
}

function clearTimer(){ if(state.timer) clearInterval(state.timer); state.timer=null; $("count").hidden=true; }

function handleQR(text){
  clearTimer();
  if(!/^https?:\/\//i.test(text)){
    say("warn","This QR is not a web address","",[text.slice(0,120)]);
    return;
  }
  state.target = text.trim();
  $("hitUrl").textContent = state.target;
  $("hitSec").hidden = false;
  $("hitSec").scrollIntoView({ behavior:"smooth", block:"start" });

  if(!isFoodQR(state.target)){
    say("warn","Not a FOOD QR","",
      ["푸드QR이 아닌 QR이다. 태극마크 + FOOD QR 표기를 확인할 것.","그래도 열려면 아래 버튼을 누를 것."]);
    return;
  }
  quiet();
  if($("autoGo").checked) countdownGo(3);
}

function countdownGo(n){
  $("count").hidden = false;
  const paint = () => { $("count").textContent = T().opening.replace("{n}", n); };
  paint();
  state.timer = setInterval(()=>{
    n--;
    if(n <= 0){ clearTimer(); go(); return; }
    paint();
  }, 1000);
}

function go(){
  clearTimer();
  if(!state.target) return;
  window.location.assign(isFoodQR(state.target) ? translatedUrl(state.target, state.lang) : state.target);
}

/* ---------- wiring ---------- */
function applyLang(){
  const t = T();
  document.documentElement.lang = state.lang;
  $("l_lang").textContent=t.lang; $("l_auto").textContent=t.auto;
  $("l_found").textContent=t.found; $("l_foot").textContent=t.foot;
  $("btnStart").textContent=t.start; $("btnStop").textContent=t.stop; $("btnTorch").textContent=t.torch;
  $("btnPick").textContent=t.pick; $("btnGo").textContent=t.go;
  $("btnOriginal").textContent=t.korean; $("btnAgain").textContent=t.again;
  $("idle").textContent = t.idle;
  [...$("langs").children].forEach(b=>{
    const on = b.dataset.code === state.lang;
    b.setAttribute("aria-pressed", on);
    if(on && !applyLang.scrolled){ applyLang.scrolled=true; b.scrollIntoView({inline:"center",block:"nearest"}); }
  });
}

LANGS.forEach(l=>{
  const b=document.createElement("button");
  b.className="lang"; b.type="button"; b.dataset.code=l.code; b.textContent=l.label;
  b.onclick=()=>{
    state.lang=l.code; localStorage.setItem("flr.lang",l.code);
    clearTimer(); applyLang(); renderDiag();
  };
  $("langs").appendChild(b);
});

$("btnStart").onclick = startCamera;
$("btnStop").onclick  = stopCamera;
$("btnTorch").onclick = toggleTorch;
$("btnGo").onclick    = go;
$("btnOriginal").onclick = ()=>{ clearTimer(); if(state.target) window.location.assign(state.target); };
$("btnAgain").onclick = ()=>{
  clearTimer(); $("hitSec").hidden=true; preview.hidden=true; $("idle").hidden=false;
  state.lastQR=""; state.target=""; quiet(); startCamera();
};
$("autoGo").onchange = e => { if(!e.target.checked) clearTimer(); };
$("btnPick").onclick  = ()=> (ENV.inApp ? $("fileCam") : $("filePick")).click();
$("btnManual").onclick = ()=>{
  const v = $("manual").value.trim();
  if(v) handleQR(v);
};

[$("fileCam"),$("filePick")].forEach(inp=>{
  inp.onchange = async e=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    stopCamera(); quiet(); clearTimer();
    const im = await loadImage(f);
    showPreview(im);
    say("busy", T().scanning, "");
    const w = Math.min(im.naturalWidth,1400);
    const h = Math.round(w * im.naturalHeight / im.naturalWidth);
    const data = await decodeFrom(im, w, h);
    if(data) handleQR(data);
    else say("warn","No QR code in this photo","",["푸드QR이 화면 가운데 오도록 다시 촬영할 것."]);
  };
});

(function init(){
  const param = new URLSearchParams(location.search).get("lang");
  const saved = localStorage.getItem("flr.lang");
  const nav = navigator.language || "en";
  const match = c => LANGS.some(l => l.code.toLowerCase() === String(c).toLowerCase());
  state.lang = match(param) ? param : (saved || (LANGS.find(l =>
    nav.toLowerCase().startsWith(l.code.toLowerCase().slice(0,2)))?.code) || "en");

  applyLang(); renderDiag("idle");
  const blocked = cameraBlockedReason();
  if(blocked){ say("warn", blocked.title, "", blocked.fixes); $("diagDrawer").open = true; }
  window.addEventListener("pagehide", stopCamera);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ stopCamera(); clearTimer(); } });
})();
</script>
